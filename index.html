<!DOCTYPE html>
<html>
<head>
<title>ColorfulNOOK OS</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500&display=swap" rel="stylesheet">
</head>
<body>
<div id="background"></div>
<svg width="0" height="0" style="position:absolute">
<filter id="px">
<feFlood x="4" y="4" height="1" width="1"/>
<feComposite width="8" height="8"/>
<feTile result="a"/>
<feComposite in="SourceGraphic" in2="a" operator="in"/>
<feMorphology operator="dilate" radius="4"/>
</filter>
</svg>
<div id="taskbar">
<p>ColorfulNOOK OS</p>
<p class="time-now">Time</p>
</div>
<div class="app-icon" id="openWelcomeTab">
<p>welcome</p>
</div>
<div class="app-icon" id="openAnimeTab">
<p>anime</p>
</div>
<div class="app-icon" id="open-notes-tab">
<p>notes</p>
</div>
<div class="app-icon" id="open-calculator-tab">
<p>calc</p>
</div>
<div id="welcome" class="app-window welcome-window" style="top:78px;left:210px">
<div id="welcomeheader" class="app-header">
<p class="header-title">Welcome!</p>
<button class="close-button" id="closeWelcomeTab" type="button"></button>
</div>
<div id="welcome-paragraph">
Hi, I'm Athan. This is ColorfulNOOK OS, a small desk with a loud living room behind it.
<a href="https://github.com/its-techxtreme">github.com/its-techxtreme</a>
</div>
</div>

<div id="notes" class="app-window notes-window" style="display:none;top:78px;left:180px">
<div id="notesheader" class="app-header">
<p class="header-title">Notes</p>
<button type="button" id="close-notes-tab" class="close-button"></button>
</div>
<div id="notes-content">
<button id="new-note-button" class="add-note" type="button">+</button>
</div>
</div>
<div id="calculator" class="app-window calc-window" style="display:none;top:78px;left:430px">
<div id="calculatorheader" class="app-header">
<p class="header-title">Calculator</p>
<button type="button" id="close-calculator-tab" class="close-button"></button>
</div>
<div id="act-calculator">
<input id="display" readonly>
<div id="keys">
<button class="calc-button" type="button" onclick="appendToDisplay('+')">+</button>
<button class="calc-button" type="button" onclick="appendToDisplay('7')">7</button>
<button class="calc-button" type="button" onclick="appendToDisplay('8')">8</button>
<button class="calc-button" type="button" onclick="appendToDisplay('9')">9</button>
<button class="calc-button" type="button" onclick="appendToDisplay('-')">-</button>
<button class="calc-button" type="button" onclick="appendToDisplay('4')">4</button>
<button class="calc-button" type="button" onclick="appendToDisplay('5')">5</button>
<button class="calc-button" type="button" onclick="appendToDisplay('6')">6</button>
<button class="calc-button" type="button" onclick="appendToDisplay('*')">*</button>
<button class="calc-button" type="button" onclick="appendToDisplay('1')">1</button>
<button class="calc-button" type="button" onclick="appendToDisplay('2')">2</button>
<button class="calc-button" type="button" onclick="appendToDisplay('3')">3</button>
<button class="calc-button" type="button" onclick="appendToDisplay('/')">/</button>
<button class="calc-button" type="button" onclick="appendToDisplay('0')">0</button>
<button class="calc-button" type="button" onclick="appendToDisplay('.')">.</button>
<button class="calc-button" type="button" onclick="calculate()">=</button>
<button class="calc-button" type="button" onclick="clearDisplay()">C</button>
</div>
</div>
</div>
<div id="anime" class="app-window" style="top:78px;left:260px;display:none">
<div id="animeheader" class="app-header">
<button class="close-button" id="animeclose" type="button"></button>
<p class="header-title">Anime</p>
</div>
<p>Click one and it shows in this window.</p>
<div id="picks">
<button type="button" id="p1">Me hehe ;) </button>
<button type="button" id="p2">Horimiya ♥ </button>
<button type="button" id="p3">Cute Idol igg</button>
</div>
<img id="shot" alt="">
</div>
<script src="script.js"></script>
</body>
</html>
